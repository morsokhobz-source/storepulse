services:
  - type: web
    name: storepulse-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: storepulse-secret-change-in-production-2026
      - key: PORT
        value: "8000"
      - key: DB_PATH
        value: data/storepulse.db