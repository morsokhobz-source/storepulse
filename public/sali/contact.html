<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Boutique SALI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1C1917;
      --on-primary: #FFFFFF;
      --secondary: #44403C;
      --accent: #A16207;
      --on-accent: #FFFFFF;
      --background: #FAFAF9;
      --foreground: #0C0A09;
      --card: #FFFFFF;
      --card-foreground: #0C0A09;
      --muted: #E8ECF0;
      --muted-foreground: #475569;
      --border: #D6D3D1;
      --destructive: #DC2626;
      --ring: #1C1917;
      --cta: #A16207;
      --on-cta: #FFFFFF;
      --font-heading: 'Cormorant', serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background: var(--background);
      color: var(--foreground);
      line-height: 1.6;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--secondary);
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem;
    }

    .page-header {
      text-align: center;
      padding: 3rem 2rem 2rem;
    }

    .page-header h1 {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .page-header p {
      color: var(--muted-foreground);
      max-width: 500px;
      margin: 0 auto;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      margin-bottom: 4rem;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.5rem;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .contact-icon {
      width: 48px;
      height: 48px;
      background: rgba(161, 98, 7, 0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.5rem;
    }

    .contact-item h3 {
      font-family: var(--font-heading);
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .contact-item p {
      color: var(--muted-foreground);
      font-size: 0.9375rem;
    }

    .contact-item a {
      color: var(--accent);
      font-weight: 500;
    }

    .contact-form {
      background: var(--card);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9375rem;
      background: var(--background);
      color: var(--foreground);
      transition: all 0.2s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(161, 98, 7, 0.1);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .btn-primary {
      width: 100%;
      padding: 1rem;
      background: var(--cta);
      color: var(--on-cta);
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9375rem;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: #8B5A2B;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .contact-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="index.html" class="logo">Boutique SALI</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-header">
    <h1>Get In Touch</h1>
    <p>Visit our store, call us, or send a message.</p>
  </div>

  <div class="container">
    <div class="contact-grid">
      <div class="contact-info">
        <div class="contact-item">
          <div class="contact-icon">📍</div>
          <div>
            <h3>Address</h3>
            <p>GXMR+6J4, شارع تعزونت اعمر</p>
            <p>Bouinan, Algeria</p>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-icon">📞</div>
          <div>
            <h3>Phone</h3>
            <p><a href="tel:+213557001748">0557 00 17 48</a></p>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-icon">🕐</div>
          <div>
            <h3>Hours</h3>
            <p>Open 24 hours, 7 days a week</p>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-icon">💬</div>
          <div>
            <h3>WhatsApp</h3>
            <p><a href="https://wa.me/213557001748" target="_blank">Message us on WhatsApp</a></p>
          </div>
        </div>
      </div>

      <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent!');">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn-primary">Send Message</button>
      </form>
    </div>
  </div>
  <script src="assets/storefront.js"></script>
</body>
</html>
